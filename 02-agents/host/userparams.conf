# KVM host checks (run as the lab user).

# VM inventory for low-level discovery: [{"{#VM}":"prm1"}, ...]
UserParameter=lab.vm.discovery,virsh -c qemu:///system list --all --name | awk 'NF{printf "%s{\"{#VM}\":\"%s\"}", (n++?",":"["), $1} END{print (n?"]":"[]")}'
# 1 = running, 0 = anything else (shut off, paused, crashed)
UserParameter=lab.vm.running[*],virsh -c qemu:///system domstate "$1" 2>/dev/null | grep -qx running && echo 1 || echo 0
# paused VMs: what a full thin-provisioned host causes (I/O error -> pause)
UserParameter=lab.vm.paused.count,virsh -c qemu:///system list --state-paused --name | grep -c .
UserParameter=lab.vm.running.count,virsh -c qemu:///system list --state-running --name | grep -c .
# Thin provisioning: what the VM disk images could still grow by vs what the file system has left
UserParameter=lab.thin.json,/home/huy/work/noc-monitoring-incident-lab/02-agents/host/thin.sh
