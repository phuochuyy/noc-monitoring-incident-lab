# Zabbix agent 2 on the KVM host, run as the lab user (systemd --user), active checks only.
# Why the lab user and not the packaged service: the checks need `virsh -c qemu:///system` (libvirt group)
# and the Oracle Instant Client in ~/work/tools; the packaged agent (user zabbix) has neither.
# Passive checks listen on loopback only: the server runs in rootless Podman and would reach the host
# through the LAN address (DHCP), so nothing is opened to the network.

# Host names this agent asks active checks for: the host itself and the logical database hosts whose
# Oracle checks run from here (the plugin connects over the network with the read-only C##MON user).
Hostname=kvm-host,db-orcl,db-orcl-stb,db-orcl3,db-orcl3-stb,fw1
ServerActive=127.0.0.1:10051
Server=127.0.0.1
ListenIP=127.0.0.1
ListenPort=10055
RefreshActiveChecks=60
BufferSend=5
Timeout=15

PidFile=/run/user/1000/zabbix_agent2.pid
ControlSocket=/run/user/1000/zabbix_agent2.sock
LogType=file
LogFile=/home/huy/.local/state/zabbix/zabbix_agent2.log
LogFileSize=10

# Oracle plugin: custom SQL in ../../03-oracle/sql, used as oracle.custom.query[...,<file name>]
Plugins.Oracle.CustomQueriesPath=/home/huy/work/noc-monitoring-incident-lab/03-oracle/sql
Plugins.Oracle.CallTimeout=10
Plugins.Oracle.ConnectTimeout=5
Plugins.Oracle.KeepAlive=120
# the URI in the item key is a TNS alias from ../../03-oracle/tns/tnsnames.ora (TNS_ADMIN in the unit)
Plugins.Oracle.ResolveTNS=true

Include=/home/huy/work/noc-monitoring-incident-lab/02-agents/host/userparams.conf
# firewall of noc-network-firewall-lab (host fw1)
Include=/home/huy/work/noc-network-firewall-lab/04-monitoring/userparams-fw1.conf
